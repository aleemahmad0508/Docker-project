<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Cloud Notes</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>🐳 Docker Cloud Notes</h1>

        <p class="subtitle">
            Flask + PostgreSQL running with Docker
        </p>

        <form action="/add" method="POST" class="note-form">

            <input
                type="text"
                name="title"
                placeholder="Note title"
                required
            >

            <textarea
                name="content"
                placeholder="Write your note..."
                required
            ></textarea>

            <button type="submit">
                Add Note
            </button>

        </form>

        <h2>My Notes</h2>

        {% if notes %}

            {% for note in notes %}

            <div class="note">

                <div>
                    <h3>{{ note[1] }}</h3>

                    <p>{{ note[2] }}</p>
                </div>

                <form
                    action="{{ url_for('delete_note', note_id=note[0]) }}"
                    method="POST"
                >
                    <button type="submit" class="delete">
                        Delete
                    </button>
                </form>

            </div>

            {% endfor %}

        {% else %}

            <p class="empty">
                No notes yet. Add your first note!
            </p>

        {% endif %}

    </div>

</body>
</html>
